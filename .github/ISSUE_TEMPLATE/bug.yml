name: Bug
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Home Assistant and Local vision versions.
      placeholder: Home Assistant 2026.10.1, Local vision 0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: Relevant log lines, or the diagnostics of the helper. Remove anything private.
      render: text
