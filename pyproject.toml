[project]
name = "local-vision"
version = "0.1.1"
description = "Local image recognition helpers for Home Assistant"
requires-python = ">=3.14.2"
license = "Apache-2.0"

[dependency-groups]
test = [
    "PyTurboJPEG==1.8.3",
    "pytest-homeassistant-custom-component==0.13.373",
    "tarsius==0.5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213", "E501", "PLR0912", "PLR0913", "PLR0917", "PLR2004", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
